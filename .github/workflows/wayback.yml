name: Wayback captures

# One-off: download the old wiki's battle rating lists from the Internet Archive (pre-2020 BR
# history) and keep them as an artifact for parsing. Run by hand.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Only list what the archive holds
        type: boolean
        default: false
      pages:
        description: Vehicle page infoboxes (slow, about an hour)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download captures
        working-directory: etl
        run: |
          uv sync
          uv run wtbr wayback --out ../wayback ${{ inputs.probe && '--probe' || '' }} ${{ inputs.pages && '--pages' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback
          path: wayback
          retention-days: 14
