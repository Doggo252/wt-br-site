name: Wayback captures

# One-off: download old wiki pages from the Internet Archive (pre-2020 BR history) and keep them
# as artifacts for parsing (`wtbr wayback --parse`). Run by hand.
on:
  workflow_dispatch:
    inputs:
      probe:
        description: Only list what the archive holds
        type: boolean
        default: false
      pages:
        description: Vehicle page infoboxes (slow; split into four jobs)
        type: boolean
        default: false
      after:
        description: With pages, resume after this page (the last one a previous run saved)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lists:
    if: ${{ !inputs.pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download captures
        working-directory: etl
        run: |
          uv sync
          uv run wtbr wayback --out ../wayback ${{ inputs.probe && '--probe' || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback
          path: wayback
          retention-days: 14

  pages:
    if: ${{ inputs.pages }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Download page captures
        working-directory: etl
        env:
          AFTER: ${{ inputs.after }}
        run: |
          uv sync
          uv run wtbr wayback --out ../wayback --pages --shard ${{ matrix.shard }} --shards 4 ${AFTER:+--after "$AFTER"}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayback-pages-${{ matrix.shard }}
          path: wayback
          retention-days: 14
