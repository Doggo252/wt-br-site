[project]
name = "wtbr"
version = "0.1.0"
description = "ETL for Uptier: turns War Thunder datamine files into JSON for the site"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=13.0.0",
    "pydantic>=2.14.1",
]

[project.scripts]
wtbr = "wtbr.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
